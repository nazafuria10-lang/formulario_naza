<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de Registro</title>
<link rel="stylesheet" href="styles.css">
</head> 
<body> 
<div id="entradas"> 
<h1>Compra Entradas</h1> 
<p>Completa los campos </p> 
<p>Campos marcados con * son obligatorios </p> 
<img src="img/entradas.jpg" alt="entradas">
<form action="#" method="POST" id="registroForm"></form> 
</div> 
<fieldset> 
<legend>Datos Personales</legend> 
<div> 
<label for="nombre">Nombre *</label> 
<input type="text" id="nombre" name="nombre" placeholder="Ej: Nazareno " required> 
</div> 
<div> 
<label for="Apellido">Apellido *</label> 
<input type="text" id="Apellido" name="Apellido" placeholder="Ej: Furiasse" required> 
</div> 
<div> 
<label for="DNI">DNI *</label> 
<input type="number" id="DNI" name="DNI" placeholder="Ej: 50154648 " required> 
</div> 
<div> 
<label for="Fecha de nacimiento">Fecha de nacimiento </label> 
<input type="date" id="Fecha de nacimiento" name="Fecha de nacimiento" placeholder="Ej: 02/03/2010 " > 
</div> 
<div> 
<label for="Correo electrónico">Correo electrónico *</label> 
<input type="email" id="Correo electrónico" name="Correo electrónico" placeholder="Ej: xxxxxxx@gmail.com " required> 
</div> 
<div> 
<label for="Número de teléfono">Número de teléfono</label> 
<input type="number" id="Número de teléfono" name="Número de teléfono" placeholder="Ej: +5491123455077 " required> 
</div> 
</fieldset> 
<fieldset> 
<legend>Datos Extras</legend> 
<div> 
<label for="Ubicación">Ubicación *</label> 
<select id="Ubicación" name="Ubicación" required> 
<option value="">Seleccione una Ubicación </option> 
<option value="IB">Campo VIP</option> 
<option value="RI">Campo General</option> 
<option value="PW">Platea Baja</option> 
<option value="BD">Platea Alta</option> 
<option value="RI">Campo General</option> 
<option value="RI">Palco VIP</option> 
</select> 
</div> 
<div> 
<label>Fecha del Show</label> 
<div> 
<label> 
<input type="radio" name="Fecha" value="Fecha"> 15 Nov 
</label> 
<label> 
<input type="radio" name="Fecha" value="Fecha"> 16 Nov
</label> 
<label> 
<input type="radio" name="Fecha" value="Fecha"> 18 Nov
</label> 
</div> 
</div> 
<div> 
<label>Beneficios</label> 
<div> 
<label> 
<input type="checkbox" name="Beneficios" value="Beneficios"> Acceso a Soundcheck
</label> 
<label> 
<input type="checkbox" name="Beneficios" value="Beneficios"> Army Bomb Oficial 
</label> 
<label> 
<input type="checkbox" name="Beneficios" value="Beneficios"> Fast Pass 
</label> 
<label> 
<input type="checkbox" name="Beneficios" value="Beneficios"> Kit Merchandising 
</label> 
</div> 
</div> 
<div> 
<label for="comentarios">Aclaraciones especiales o accesibilidad</label> 
<textarea id="comentarios" name="comentarios" rows="4" placeholder="Indique si requiere espacio para silla de ruedas o alguna asistencia especial para el ingreso."></textarea> 
</div> 
</fieldset> 
<fieldset> 
<legend>Datos de Seguridad</legend> 
<div> 
<label for="password">Contraseña *</label> 
<input type="password" id="password" name="password" placeholder="Debe contener un minimo de 8 caracteres" minlength="8" required> 
</div> 
<div> 
<label for="confirmPassword">Confirmar contraseña *</label> 
<input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repita su contraseña" minlength="8" required> 
</div> 
<div> 
<label> 
<input type="checkbox" name="terminos" required> Acepto los <a href="#">términos y condiciones</a> * 
</label> 
</div> 
<div> 
<button type="submit">Enviar inscripción</button> 
<button type="reset">Reiniciar Compra</button> 
</div> 
</form> 
</div> 
</fieldset> 
<footer> 
<p>Formulario 2 hecho por: Nazareno Furiasse</p> 
<a href="index.html">
        <button>
            Volver al Inicio
        </button>
</a>
</footer> 
</body> 
</html>
